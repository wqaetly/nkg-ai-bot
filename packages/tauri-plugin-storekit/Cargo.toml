[package]
name = "tauri-plugin-storekit"
version = "0.1.0"
authors = ["NKG AI"]
description = "Minimal StoreKit 2 bridge for NKG consumable AI point purchases"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-storekit"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
