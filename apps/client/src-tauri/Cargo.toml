[package]
name = "nkg-ai-bot"
version = "0.1.0"
description = "Local-first cross-platform AI client"
authors = ["NKG AI Bot contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nkg_ai_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
ios-bonjour-check = []
desktop-power = [
  "dep:tauri-plugin-shell",
  "dep:tokio",
  "dep:url",
  "dep:uuid",
]

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "unsafe-headers"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
tauri-plugin-storekit = { path = "../../../packages/tauri-plugin-storekit" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
rand = "0.8"
chacha20poly1305 = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = { version = "2", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
mdns-sd = "0.20"

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 8
panic = "abort"

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
