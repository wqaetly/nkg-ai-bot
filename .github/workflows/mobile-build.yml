name: Mobile build gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm64 Release APK and AAB
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nkg-ai-flow/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/nkg-ai-bot-build
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/client/src-tauri/target
          key: android-arm64-${{ runner.os }}-${{ hashFiles('apps/client/src-tauri/Cargo.lock', 'apps/client/src-tauri/Cargo.toml', 'apps/client/src-tauri/gen/android/app/build.gradle.kts', 'apps/client/src-tauri/gen/android/gradle.properties', 'scripts/android-*.mjs', 'scripts/rust-env.mjs') }}
          restore-keys: |
            android-arm64-${{ runner.os }}-

      - name: Install Android SDK and Rust target
        shell: pwsh
        run: |
          $ndkVersion = "28.2.13676358"
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ndkVersion"
          rustup target add aarch64-linux-android
          $ndkHome = Join-Path $env:ANDROID_HOME "ndk\$ndkVersion"
          "NDK_HOME=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_NDK_HOME=$ndkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install nkg-ai-flow dependencies
        run: npm ci --prefix nkg-ai-flow

      - name: Install application dependencies
        run: npm ci

      - name: Verify mobile build contracts
        run: npm test -- --run apps/client/test/platformBuildConfig.test.ts

      - name: Build Android Release APK and AAB
        run: npm run android:build -- --target aarch64 --apk --aab --max-apk-mib 40

      - uses: actions/upload-artifact@v4
        with:
          name: nkg-ai-bot-android-arm64-release
          path: |
            apps/client/src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk
            apps/client/src-tauri/gen/android/app/build/outputs/bundle/arm64Release/*.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS arm64 Simulator Release app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nkg-ai-flow/package-lock.json

      - name: Install Rust simulator target
        run: rustup target add aarch64-apple-ios-sim

      - name: Install nkg-ai-flow dependencies
        run: npm ci --prefix nkg-ai-flow

      - name: Install application dependencies
        run: npm ci

      - name: Verify mobile build contracts
        run: npm test -- --run apps/client/test/platformBuildConfig.test.ts

      - name: Generate iOS project
        run: npm run ios:init -- --ci

      - name: Build iOS Simulator Release app
        run: npm run ios:build -- --target aarch64-sim --ci

      - uses: actions/upload-artifact@v4
        with:
          name: nkg-ai-bot-ios-arm64-simulator-release
          path: apps/client/src-tauri/gen/apple/build/**/*.app/**
          if-no-files-found: error
          retention-days: 7
