name: Desktop Release gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: ${{ matrix.os }} Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: apps/client/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: dmg
            artifact: apps/client/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            bundle: deb
            artifact: apps/client/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/client/src-tauri/target
          key: desktop-release-${{ runner.os }}-${{ hashFiles('apps/client/src-tauri/Cargo.lock', 'apps/client/src-tauri/Cargo.toml', 'apps/client/src-tauri/tauri.conf.json') }}
          restore-keys: |
            desktop-release-${{ runner.os }}-

      - name: Install application dependencies
        run: npm ci

      - name: Run platform-neutral contracts
        run: npm test -- --run

      - name: Audit bundled example Flows
        run: npm run test:example-flows

      - name: Build host sidecar
        run: npm run build:sidecar

      - name: Verify sidecar auth and readiness
        run: npm run test:e2e -w @nkg-ai-bot/runtime-sidecar

      - name: Build complete Tauri Release bundle
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: nkg-runtime-${{ runner.os }}-${{ runner.arch }}
          path: apps/client/src-tauri/binaries/nkg-runtime-*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: nkg-ai-bot-${{ runner.os }}-${{ runner.arch }}-release
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
